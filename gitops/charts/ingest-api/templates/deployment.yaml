apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  labels:
    app.kubernetes.io/name: ingest-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-api
    spec:
      serviceAccountName: ingest-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DOCUMENTS_BUCKET
              value: {{ required "documentsBucket is required" .Values.env.documentsBucket | quote }}
            - name: JOBS_QUEUE_URL
              value: {{ required "jobsQueueUrl is required" .Values.env.jobsQueueUrl | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.env.awsRegion | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  labels:
    app.kubernetes.io/name: ingest-api
spec:
  selector:
    app.kubernetes.io/name: ingest-api
  ports:
    - name: http
      port: 80
      targetPort: http