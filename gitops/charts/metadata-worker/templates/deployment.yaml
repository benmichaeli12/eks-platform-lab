apiVersion: v1
kind: ServiceAccount
metadata:
  name: metadata-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-worker
  labels:
    app.kubernetes.io/name: metadata-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-worker
    spec:
      serviceAccountName: metadata-worker
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: DOCUMENTS_BUCKET
              value: {{ required "documentsBucket is required" .Values.env.documentsBucket | quote }}
            - name: JOBS_QUEUE_URL
              value: {{ required "jobsQueueUrl is required" .Values.env.jobsQueueUrl | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.env.awsRegion | quote }}
          envFrom:
            - secretRef:
                name: database-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]