apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.database.secretStore }}
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ required "database.secretName is required" .Values.database.secretName }}
        property: url